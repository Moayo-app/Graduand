# 개방 목록 — **단일 정본** (결정 기록: [ISSUE-2] → moayo-hq #209 · 자리 발급: [ISSUE-12] 부수).
#
# 모형 = 허용 목록: 여기 적힌 나라만 열리고, **미등재 국가 = 닫힘**이다.
# 확장 절차 = 「요청이 오면 그 나라를 잰다」 — 나라별 측정 → 결정 티켓 → 이 파일 PR
# (자매 제품 Re-Stance #101 모형 상속 · 조용한 증식 금지). 줄이는 법 = 행 삭제.
#
# ⭐ 로케일 분모가 이 파일에서 유도된다 — `doc_locale` 의 합집합이 그 분모이고, **읽는 쪽이
# 둘**이다: ⑴ 정책 문서(docs/policies/) — tools/lib/policy.mjs `docLocales`·`policyFiles`
# ⑵ 진단 화면의 문구 카탈로그(diagnosis/src/strings.ts 의 `LOCALES`·`CATALOG`) —
# tools/lib/screen-locales.mjs 가 **양방향**으로 댄다. 테스트에 로케일 수를 적지 않는다.
#
# ⚠️⚠️ 그래서 **이 파일에 행을 더하는 것이 곧 화면의 일거리**다 — 새 `doc_locale` 을 적고
# 벌을 만들지 않으면 그 PR 이 빨갛다(「그 나라를 열어 놓고 화면이 그 말을 못 한다」).
# ⭕ 같은 로케일을 쓰는 나라를 더하는 것은 초록이다 — 분모는 나라가 아니라 **로케일**이다.
#
# 표기 = ISO 3166-1 alpha-2 대문자. 행마다 근거 필수.
countries:
  - code: KR
    doc_locale: ko
    basis: "본국(법인 소재국) — 선택지가 아니라 준수 대상 (moayo-hq #209 결정 4)"
  - code: US
    doc_locale: en
    basis: "B2B 개발자 도구 최대 시장 — ⏳ 조건부(moayo-hq #209 결정 4, 선행 측정 moayo-hq #218 통과 전에는 결제를 열지 않는다)"
