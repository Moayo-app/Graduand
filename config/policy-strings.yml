# 정책 문서의 금칙·필수 문자열 — **단일 정본** ([ISSUE-12] · 가드 명세 정본: moayo-hq #211 §3 G3).
#
# 가드(tools/test/policy-guards.test.mjs)가 이 파일에서 값을 읽어 docs/policies/ 전수를 판정한다.
# ⛔ 테스트 코드에 이 값들을 리터럴로 적지 않는다 — 두 벌이 되는 순간 갈라진다.
#
# ⭕ product.name 은 **확정됐다** (2026-10-27 · [ISSUE-1] / moayo-hq #207) — 상표 출원 2건
# (심볼 40-2026-0226190 · 워드 40-2026-0226216)이 그것을 지탱한다. ⭐ 이름이 **바뀌지 않고**
# 확정됐으므로 이 값은 그대로이고 former_names 는 빈 채다 — 치환 기전(G4)이 할 일이 0 이다.
# ⛔ 그래도 기전을 걷지 않는다: **출원은 등록이 아니고** 심사가 열려 있어 거절·이의가 오는
# 날 이름이 다시 열린다. 그날 이 값과 본문 6벌을 **함께** 치환하고 옛 이름을 former_names 로
# 내린다 — G4 가 둘을 묶고, 그 금칙이 그 순간부터 잔재를 잡는다.

product:
  name: graduand          # 소문자 한 단어 식별자 ([ISSUE-1]) — 본문 표기도 이것 하나
  former_names: []        # 이름 확정·교체 때 이전 이름이 여기로 내려온다

vendor:
  brand: Polar            # 본문이 쓰는 유일한 표기 ([ISSUE-4] — 브랜드 이름만, 법인명은 처리방침 표에만)
  legal_name: Polar Software, Inc.   # 처리방침 §5·§6 표 전용 — 산문 금지 (가드 G6)
  contact: legal@polar.sh # 국외이전 표(처리방침 §6)의 이전받는 자 연락처
  former_brands:
    - Paddle              # 자매 제품이 거절당한 벤더 — 구조 상속 경로로 새어 들어올 수 있는 유일한 옛 이름

required:
  # 번역판 선두의 한국어판 우선 조항 — moayo-hq #211 §1 축자. 로케일이 늘면 그 로케일의
  # 조항을 여기 더한다(없으면 가드 G9 가 config 결손으로 빨갛다).
  priority_clause:
    en: The official version of this document is the Korean version. If this translation and the Korean version differ in interpretation, the Korean version prevails.
  # 시행일 미정 상태의 본문 문면 — 머리말 「시행일: 미정」과 본문을 1:1 로 묶는 핀(가드 G7).
  # 시행일이 채워지는 날부터는 이 핀 대신 날짜 문면을 잰다.
  effective_unset:
    ko: 시행일은 아직 정해지지 않았습니다
    en: has not yet been set
  # 발행일 미정 상태의 본문 문면 — 머리말 「발행일: 미정」과 본문을 1:1 로 묶는 핀(가드 G7).
  # ⭐ 발행일은 **그 판이 게시된 날**이고 시행일은 **효력이 시작되는 날**이다. 1.0.0 은 둘이
  # 같은 날이지만(결제가 열리는 날) 그것은 **이 판의 사실**이고, 변경 고지 조항이 「시행
  # 7일/30일 전까지 알린다」라 다음 판부터는 발행이 시행보다 앞선다. ⇒ 칸은 둘이다.
  published_unset:
    ko: 발행일은 아직 정해지지 않았습니다
    en: the publication date has not yet been set
  # 본문이 판번호를 적을 때 쓰는 **라벨** — 머리말 「버전: N」과 본문을 1:1 로 묶는 핀(가드 G7).
  # ⚠️⚠️ 판번호가 사는 자리가 둘이다: 기계가 읽는 머리말과 사람이 읽는 본문 부칙. 그리고
  # **머리말은 발행본에서 걷힌다**(작업 메모는 게시물에 싣지 않는다) — 그래서 방문자가 보는
  # 판번호는 본문의 이 자리 **하나**다. 둘이 갈라지면 **공개되는 쪽만 틀린다.**
  # ⛔ 로케일이 늘면 그 로케일의 라벨을 여기 더한다 — 없으면 가드가 config 결손으로 빨갛다.
  version_label:
    ko: 판
    en: version

forbidden:
  # 「환불 불가」류 단정 — AC3. 조건부·범위 한정 서술(「비례 계산해 환불하지는 않습니다」)은
  # 허용되고, 여기 적는 것은 권리를 뭉개는 **단정**의 문면이다.
  refund_absolutes:
    ko:
      - 환불 불가
      - 환불이 불가능
      - 환불되지 않습니다
      - 환불받을 수 없습니다
      - 환불해 드리지 않습니다
      - 어떤 경우에도 환불
    en:
      - non-refundable
      - nonrefundable
      - no refund
      - cannot be refunded
      - not eligible for a refund
      - under no circumstances
