# 공개 범위 선언 — **단일 정본**. 2단 배포의 둘째 홉이다.
#
# ⭐⭐ 왜 선언이 분모인가. 「이 파일은 공개해도 되는가」를 기계가 판정할 수 없다 — 누설은
# 경로 모양이 아니라 **내용의 성질**이고, 그것을 아는 것은 사람뿐이다. 그래서 기계가 재는
# 것을 바꾼다: 「공개해도 되는가」가 아니라 **「선언돼 있는가」**다. 사람이 선언하고, 기계가
# 그 분모로 전수를 센다.
#
# ⚠️⚠️ **allowlist 다 — denylist 가 아니다.** 선언에 없는 경로는 **가지 않는다**(배달 쪽이
# 읽는 목록이 이것이고, 받는 쪽 가드는 「선언 밖 파일이 이 트리에 0」을 단정한다).
# 빠뜨린 파일은 **조용히 공개되지 않고 빨강이 된다** — 틀리는 방향이 안전한 쪽이다.
# ⛔ 금칙 목록(「이것만 빼고 다」)으로 뒤집지 않는다: 빠뜨림이 곧 누설이 되는 방향이다.
#
# origin = **그 파일의 정본이 어디 사는가**. 이 축이 가드의 분모를 가른다:
#   local    — 이 저장소가 정본. 여기서 쓰고 여기서 고친다.
#   platform — 공유 블록 생성물. ⛔ 손으로 고치지 않는다(드리프트 체크가 집행한다).
#   workshop — 비공개 작업장에서 **배달된** 제품 코드. ⭐ 내부 산문 0 이 단정되는 모집단이
#              정확히 이 항들이다 — `local`·`platform` 산문은 내부 포인터를 당연히 들고,
#              그것을 같은 잣대로 재면 가드가 저장소 전체를 빨갛게 하고 뜻을 잃는다.#
# license = **그 경로에 어떤 허가가 붙는가.** ⚠️⚠️ 이 축이 없으면 기본값은 **침묵**이고,
# 침묵의 뜻은 all rights reserved 다 — 저장소를 읽은 사람이 가드 한 줄도 베껴 쓸 수 없다.
# 그래서 행마다 **적는다**. 네 값의 성질이 다르다:
#   BSL-1.1    — 제품. ⭐ 증서(`LICENSE`)의 `Licensed Work` 가 이 경로를 **이름으로 부른다** —
#                가드가 양방향 1:1 을 잰다(tools/lib/license-copy.mjs). 증서가 부르지 않는
#                경로에 이 값을 적거나, 증서가 부르는 경로에 적지 않으면 빨강이다.
#   Apache-2.0 — 저장소 운영. ⭐ 전문이 **이미 여기 있다**(LICENSE-APACHE-2.0 = Change License)
#                — 이 허가는 증서 파일을 한 벌도 늘리지 않는다.
#   reserved   — 선언된 all rights reserved. ⚠️ **읽히기 위해** 공개된 것이고 재사용 허가는
#                없다. 핵은 답이 아니라 **적힌다는 것**이다 — 미판정은 통과가 아니다.
#   upstream   — 남이 쓴 증서의 전문. 우리가 줄 수 있는 허가가 아니다.
# ⛔ **파일 머리 표기를 쓰지 않는다** — `origin: platform` 항은 손으로 고칠 수 없고(드리프트가
# 집행한다), 머리 표기는 파일마다 갈라지는 사본이다. ⇒ 경로 → 허가의 정본은 **이 축 하나**고,
# 묶음마다의 **사유**는 docs/licensing/repository-licensing.md 가 갖는다(배정과 사유를 나눈다).
#
# group = **그 경로가 CLAUDE.md §1 의 어느 묶음인가.** 축 셋째이고 성질이 앞 둘과 다르다 —
# `origin`·`license` 의 값은 이 파일이 닫힌 목록으로 들지만, 묶음의 **정본은 §1 의 표**다
# (범위 목록을 세운 결의가 정한 분담: 「범위의 정의」는 산문이 하고 **배정**은 선언이 한다). ⇒ 가드가
# 둘을 **양방향으로** 묶는다 — 표에 없는 이름을 쓰면 빨갛고, 표에 있는데 **아무 행도 쓰지
# 않는 묶음**도 빨갛다(「허공을 가리키는 행 0」의 반대 방향이다).
#
# ⭐⭐ **왜 축을 더하는가.** 분모의 사슬이 셋인데 마지막 칸만 기계가 없었다 —
# 「파일 전수 → 선언의 행」은 가드가 집행하고, 「선언의 행 → §1 의 묶음」은 **사람이 셌다.**
# 한 행이 셋을 함께 쥐면 **선언에 있으면서 묶음 밖인 행이 생길 수 없다.**
#
# ⚠️ **그래서 행의 입자가 묶음보다 굵으면 안 된다.** `tools/` 가 한 행이던 동안 그 행은
# 가드(운영)와 정책 렌더(사이트 배선)를 **함께** 담고 있었다 — 어느 값을 적어도 절반이
# 거짓이다. ⛔ 접두사 안에 더 좁은 행을 넣는 길은 막혀 있다: 덮는 규칙이 「**먼저 매칭되는
# 행이 이긴다**」(tools/lib/public-scope.mjs)라 더 좁은 행이 **조용히 죽은 행**이 된다.
# ⇒ 겹치지 않게 **쪼갠다.** 대가는 그 아래 새 파일이 행을 요구한다는 것이고, 빠뜨림이
# 누설이 아니라 빨강인 방향이라 이 저장소가 이미 고른 쪽이다.
#
# mirrors = **이 파일은 <경로>의 바이트 사본이고, 정본은 그 <경로>다.** 선택 축이다.
#
# ⭐⭐ 왜 사본을 선언하는가. 사본을 피할 수 없는 자리가 하나 있다 — 루트 `LICENSE` 는
# 저장소의 **공개 얼굴**이라 루트에 있어야 하고, 증서의 정본은 발행본이 싣는
# `verifier/LICENSE` 다(npm 이 패키지 루트 밖의 파일을 실을 수 없고, BSL 축자가 「each
# original or modified copy」에 증서를 걸라고 요구한다). ⇒ **사본을 피할 수 없으면 손으로
# 맞추지 않고 선언한다**: 배달이 이 축을 읽어 따라 쓰고, 가드가 바이트까지 대조한다.
#
# ⚠️ 이 축이 배달 접두사 **밖**의 한 자리를 배달이 건드리게 하는 유일한 길이다. 그래서
# ⛔ 스크립트에 경로를 박지 않는다 — 예외가 **선언 안에** 남아야 「선언이 분모」가 깨지지
# 않는다. 미러 행은 `origin: local` 이다: 배달받는 것이 아니라 배달이 **유도하는** 파생물이다.
#
# 줄이는 법 = 행 삭제(그 경로는 다음 배달에서 가지 않는다). 늘리는 법 = 행 추가 + 근거.
# 표기: `/` 로 끝나면 디렉터리 접두사(그 아래 전부), 아니면 파일 하나.
entries:
  - path: .github/workflows/
    origin: local
    license: Apache-2.0
    group: "저장소 운영"
    basis: "저장소 운영 — 가드와 CI. 공개 저장소에서 무엇이 재어지는지가 보여야 한다"
  - path: .gitignore
    origin: local
    license: Apache-2.0
    group: "저장소 운영"
    basis: "산출물 제외 — 이 파일이 가드의 미추적 분모를 유도한다(사본 금지)"
  - path: CLAUDE.md
    origin: local
    license: Apache-2.0
    group: "저장소 운영"
    basis: "세션 부트스트랩 — 칼이 첫 화면에 산다. 내부 근거는 포인터로만 가리킨다"
  - path: CONTRIBUTING.md
    origin: local
    license: Apache-2.0
    group: "저장소 운영"
    basis: "기여 안내 — 받는 입력과 받지 않는 입력. 공개 산문 가드(tools/lib/public-surface.mjs)의 모집단이 이 파일이다"
  - path: LICENSE
    origin: local
    license: upstream
    group: "증서 전문"
    mirrors: verifier/LICENSE
    basis: "지금 적용되는 라이선스 — BSL 1.1 증서. ⚠️⚠️ **정본은 이 파일이 아니다** — 증서는 작업장이 들고 배달이 verifier/LICENSE 로 나른다. 이 파일은 저장소의 **공개 얼굴**이라 루트에 있어야 하고, 배달 접두사 밖이다. ⭕ 그래서 위 mirrors 축으로 **선언했다** — 배달이 따라 쓰고 사람 손은 0 이다. ⚠️ 발행마다 Change Date 가 다시 박히는 자리가 정본 쪽이므로, 손으로 고칠 유혹이 생기는 파일은 이쪽이다: ⛔ 여기를 고치지 않는다(다음 배달이 되돌린다). 고칠 자리는 작업장의 증서다"
  - path: LICENSE-APACHE-2.0
    origin: local
    license: upstream
    group: "증서 전문"
    basis: "Change License 의 전문 — Apache-2.0. Change Date 이후에 적용되는 라이선스이고, 증서가 이 파일을 이름으로 가리킨다"
  - path: README.md
    origin: local
    license: Apache-2.0
    group: "저장소 운영"
    basis: "입구 산문"
  - path: config/
    origin: local
    license: Apache-2.0
    group: "저장소 운영"
    basis: "선언 정본들 — 개방 목록 · 정책 문자열 · 보호 설정(ruleset.json) · 이 파일 자신. ⚠️ 어느 것도 실물을 **바꾸지** 않는다: 「무엇이 참이어야 하는가」를 적고, 가드가 실물과 대조한다"
  - path: docs/agents/
    origin: platform
    license: Apache-2.0
    group: "저장소 운영"
    basis: "공유 블록 생성물 — 트리아지 라벨 · 도메인 · 디자인 경계"
  - path: docs/brand/dist/
    origin: workshop
    license: reserved
    group: "사이트 배선"
    basis: "브랜드 자산의 **생성물** — 락업·파비콘·OG. ⭐ 배달이 필요한 이유는 이것이 **생성기의 입력**이기 때문이다: 진단 페이지의 생성기가 락업을 **읽어** 발행본에 인라인하고(사본을 만들지 않으려고) 파비콘 셋을 발행 루트로 나른다. ⇒ 이 행이 없으면 받은 트리가 **빌드되지 않는다**(ENOENT) — 누설이 아니라 빨강이고, 그것이 이 목록이 허용 쪽인 이유다. ⛔ **`docs/brand/` 를 통째로 넣지 않는다**: 그 폴더는 작도(수의 정본)·심볼 원본·가드와 **내부 근거 산문**이 같이 든 자리이고, 산문을 공개 범위에 넣는 것은 이 저장소가 세운 경계(내부 근거는 포인터로만)를 뒤집는 별 결정이다. ⇒ 입자를 **생성물 디렉터리 하나**로 좁힌다. ⚠️ 허가가 `reserved` 인 이유: 마크는 **읽히기 위해** 공개되고 재사용 허가는 없다 — 제품 코드가 아니라 표장이라 BSL 도 Apache 도 아니다(증서가 이 경로를 이름으로 부르지 않는다)"
  - path: docs/licensing/
    origin: local
    license: Apache-2.0
    group: "저장소 운영"
    basis: "라이선스 사유의 정본 둘 — feature-boundary.md 가 기능 → 게이트·선언 조건(증서의 Additional Use Grant 가 이름으로 가리킨다)이고, repository-licensing.md 가 경로 묶음마다 **왜 그 허가인가**다. ⚠️ 어느 경로에 무엇이 붙는지는 이 문서가 아니라 위 license 축이 갖는다 — 배정과 사유를 같은 자리에 두면 둘이 갈라진다"
  - path: docs/policies/
    origin: local
    license: reserved
    group: "정책 문서"
    basis: "정책 문서 6벌 + 저장소 간 정본 선언표"
  - path: package.json
    origin: local
    license: Apache-2.0
    group: "저장소 운영"
    basis: "루트 — `tools/` 가드의 측정 명령이 사는 자리 (⚠️ 받은 두 패키지는 각자 선다)"
  - path: package-lock.json
    origin: local
    license: Apache-2.0
    group: "저장소 운영"
    basis: "루트 가드의 고정 — `npm ci` 가 읽는다"
  - path: tools/lib/
    origin: local
    license: Apache-2.0
    group: "저장소 운영"
    basis: "가드 본체 — 이 저장소가 스스로를 재는 자리"
  - path: tools/render-policies.mjs
    origin: local
    license: Apache-2.0
    group: "사이트 배선"
    basis: "정책 정본(md)을 발행 루트의 HTML 로 내는 자리 — 산출이 사이트의 일부라 묶음이 운영이 아니라 배선이다. ⚠️ 디렉터리 한 행으로 두면 이 파일과 가드가 **한 행 안에서 두 묶음을 걸친다** — 선언의 입자가 묶음보다 굵으면 배정이 거짓이 된다"
  - path: tools/ruleset-drift.mjs
    origin: local
    license: Apache-2.0
    group: "저장소 운영"
    basis: "보호 설정의 선언과 실물을 대조하는 진입점 — 판정은 순수하고 실물은 표준입력으로 받는다"
  - path: tools/test/
    origin: local
    license: Apache-2.0
    group: "저장소 운영"
    basis: "가드의 테스트 — negative 가 양성보다 많다(가드가 울지 않으면 초록은 아무것도 뜻하지 않는다)"
  - path: verifier/
    origin: workshop
    license: BSL-1.1
    group: "판정기 · 어댑터"
    basis: "판정기 · 어댑터. ⭐ **증서(verifier/LICENSE)도 이 안에서 배달된다** — 정본이 작업장이고, 예외 행이 있던 이유(「작업장에 없다」)가 사라졌다. 유료 층의 소스까지 보인다: 「제로 액세스」는 검증 가능한 주장이고, 검증 가능성은 소스 공개에서 온다"
  - path: diagnosis/
    origin: workshop
    license: BSL-1.1
    group: "진단 페이지 소스"
    basis: "진단 페이지 소스. 결과가 서버로 오지 않음을 읽어서 확인할 수 있게 한다"
  - path: wrangler.jsonc
    origin: workshop
    license: Apache-2.0
    group: "사이트 배선"
    basis: "사이트가 서는 자리의 선언 — 배포가 이 저장소에서 일어나므로 파일은 여기 있어야 하고, 정본은 작업장이다(그쪽의 가드가 「헤더 분기 0 · 루트가 한 곳으로 · 발행 루트를 가리킨다」를 단정한다). 사본을 손으로 맞추지 않고 배달이 나른다 — 허가는 저장소 운영이다(제품이 아니라 발판이고, 증서가 이름으로 부르지 않는다)"

# 배달된 산문에 **없어야 하는 것** — 비공개 쪽의 이름과 내부 티켓 표기.
#
# ⭐ 이름을 적지 않고 **모양**을 적는다. 금칙 목록에 비공개 저장소 이름을 박으면 이 파일도
# 공개 표면이라 **가드 자신이 누설의 자리**가 된다. 모양으로 적으면 형제 저장소가 늘어도
# 같은 가드가 잡는다. ⚠️ 대가: 모양이 평범한 낱말을 물 수 있다(예: `cross-platform`).
# 물렸을 때 고칠 곳이 문면인지 이 목록인지는 **사람이 정한다** — 가드는 묻고, 판정하지 않는다.
forbidden_prose:
  - pattern: '[A-Za-z][A-Za-z0-9]*_dev\b'
    why: "비공개 작업장류 이름 — `…_dev` 모양"
    # ⭐⭐ **이 축이 예고한 그 자리가 실제로 왔다.** 위 머리말 축자: 「모양이 평범한 낱말을 물
    # 수 있다(예: `cross-platform`). 물렸을 때 고칠 곳이 문면인지 이 목록인지는 **사람이
    # 정한다** — 가드는 묻고, 판정하지 않는다.」 ⇒ 물린 것은 Cloudflare 호스팅 선언의 키
    # `workers_dev` 이고, 사람이 **목록 쪽**으로 정했다.
    # ⛔ **문면을 고치는 쪽은 안 된다** — 그 칸(`"workers_dev": false`)이 `workers.dev` 주소를
    #   닫아, 커스텀 도메인 없이 사이트가 서는 것(= 공개 전환이 아닌 컷오버)을 막는다. 키
    #   이름은 벤더가 정한 것이라 우리가 고를 수 없다.
    # ⭐ 그래서 **토큰 하나만** 푼다 — 모양도 낱말도 건드리지 않는다. 모양을 느슨하게 하면
    #   그 순간부터 진짜 저장소 이름이 빠져나갈 길이 함께 열린다(면제가 금칙을 삼키는 모양).
    # ⚠️ **면제가 조용히 영구화되지 않는다** — 그 토큰이 트리에서 사라지면 가드가 「낡은 면제」로
    #   빨갛다. 이 저장소는 이미 한 번 그렇게 면제를 걷었다(그 단정이 울어서 걷혔다).
    except:
      - token: workers_dev
        why: "Cloudflare 호스팅 선언의 키 — 저장소 이름이 아니다. 그 칸이 workers.dev 주소를 닫는다"
  - pattern: '[A-Za-z][A-Za-z0-9]*-hq\b'
    why: "회사 층 저장소류 이름 — `…-hq` 모양"
  - pattern: '[A-Za-z][A-Za-z0-9]*-platform\b'
    why: "내부 플랫폼 저장소류 이름 — `…-platform` 모양"
  - pattern: '\b[Aa][Dd][Rr]-[0-9]+'
    why: "내부 결정 기록 표기 — `ADR-<N>`"
  - pattern: '\b[Ii][Ss][Ss][Uu][Ee]-[0-9]+'
    why: "내부 티켓 표기 — `ISSUE-<N>`"
